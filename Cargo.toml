[package]
name = "envconfig"
version = "1.4.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Decode environment variables into a user-defined specification struct."
repository = "https://github.com/kelseyhightower/envconfig"
readme = "README.md"
keywords = ["environment", "config", "configuration", "env"]
categories = ["config"]

[workspace]
members = ["envconfig-derive"]

[dependencies]
envconfig-derive = { path = "envconfig-derive", version = "1.4.0" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
